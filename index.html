<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Điểm Thi - Trường Đại Học Gia Định</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    /* HEADER */
    .header {
      background-color: #0b132b;
      padding: 40px 20px 35px 20px;
      text-align: center;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-svg {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
    }

    .school-title {
      font-size: 22px;
      font-weight: 800;
      color: #009be3;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .exam-title {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* FORM TRA CỨU */
    .search-card {
      padding: 35px 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
      font-size: 15px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.2s ease;
      outline: none;
      color: #334155;
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .form-group input:focus {
      border-color: #0084c7;
      box-shadow: 0 0 0 3px rgba(0, 132, 199, 0.15);
    }

    .note-text {
      font-size: 13.5px;
      color: #64748b;
      margin-top: 5px;
      margin-bottom: 25px;
      font-style: italic;
    }

    .btn-search {
      width: 100%;
      padding: 14px;
      background-color: #0084c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-search:hover {
      background-color: #0073b1;
    }

    /* KẾT QUẢ TRA CỨU */
    .result-container {
      margin-top: 25px;
      display: none;
    }

    .result-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
    }

    .result-header {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 15px;
      text-align: center;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px dashed #cbd5e1;
      font-size: 15px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #64748b;
      font-weight: 500;
    }

    .info-value {
      color: #0f172a;
      font-weight: 600;
    }

    .badge-pass {
      color: #16a34a;
      background-color: #dcfce7;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
    }

    .badge-fail {
      color: #dc2626;
      background-color: #fee2e2;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
    }

    .no-result {
      text-align: center;
      color: #ef4444;
      font-weight: 600;
      padding: 15px;
      background-color: #fef2f2;
      border-radius: 10px;
      border: 1px solid #fecaca;
    }

    .multiple-results-notice {
      font-size: 13px;
      color: #0084c7;
      margin-bottom: 12px;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HEADER ĐÚNG NHƯ ẢNH MẪU -->
    <div class="header">
      <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- Vòng nguyệt quế -->
        <g fill="#f59e0b">
          <path d="M 60 140 C 40 110, 40 70, 70 40 C 65 55, 60 75, 70 95 C 60 110, 55 125, 60 140 Z"/>
          <path d="M 45 120 C 30 100, 35 75, 55 55 C 50 70, 50 85, 55 100 C 48 110, 45 115, 45 120 Z"/>
          <path d="M 140 140 C 160 110, 160 70, 130 40 C 135 55, 140 75, 130 95 C 140 110, 145 125, 140 140 Z"/>
          <path d="M 155 120 C 170 100, 165 75, 145 55 C 150 70, 150 85, 145 100 C 152 110, 155 115, 155 120 Z"/>
        </g>
        <!-- Khiên -->
        <path d="M 100 25 L 155 48 V 102 C 155 140, 100 168, 100 168 C 100 168, 45 140, 45 102 V 48 Z" 
              fill="#1e3a8a" stroke="#f59e0b" stroke-width="4.5"/>
        <!-- Biểu tượng GD -->
        <g stroke="#f59e0b" stroke-width="3" fill="none">
          <rect x="78" y="68" width="44" height="44" transform="rotate(45 100 90)" />
          <rect x="78" y="68" width="44" height="44" />
        </g>
        <text x="100" y="97" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="middle">GD</text>
        <!-- Dải lụa POPULARIS -->
        <path d="M 35 150 Q 100 172 165 150 L 153 133 Q 100 153 47 133 Z" fill="#1e3a8a" stroke="#f59e0b" stroke-width="2"/>
        <text x="100" y="148" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2.5">POPULARIS</text>
      </svg>

      <div class="school-title">GIA DINH UNIVERSITY</div>
      <div class="exam-title">KỲ THI ĐÁNH GIÁ NĂNG LỰC TIẾNG ANH ĐẦU VÀO</div>
    </div>

    <!-- FORM TRA CỨU -->
    <div class="search-card">
      <form id="searchForm" onsubmit="traCuuDiem(event)">
        
        <div class="form-group">
          <label for="sbdInput">Số Báo Danh (SBD):</label>
          <input type="text" id="sbdInput" placeholder="Nhập Số Báo Danh (Ví dụ: SBD12345)" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="hoTenInput">Họ và Tên thí sinh:</label>
          <input type="text" id="hoTenInput" placeholder="Nhập Họ và Tên (Ví dụ: Nguyễn Văn A)" autocomplete="off">
        </div>

        <div class="note-text">* Bạn có thể nhập Số Báo Danh, Họ tên hoặc nhập cả hai để tìm kiếm.</div>

        <button type="submit" class="btn-search">Tra Cứu Kết Quả</button>
      </form>

      <!-- HIỂN THỊ KẾT QUẢ -->
      <div id="resultContainer" class="result-container"></div>
    </div>
  </div>

  <script src="data.js"></script>

  <script>
    function traCuuDiem(event) {
      event.preventDefault();

      const inputSBD = document.getElementById('sbdInput').value.trim().toLowerCase();
      const inputName = document.getElementById('hoTenInput').value.trim().toLowerCase();
      const resultContainer = document.getElementById('resultContainer');

      if (!inputSBD && !inputName) {
        alert("Vui lòng nhập Số Báo Danh hoặc Họ và Tên để tra cứu!");
        return;
      }

      if (typeof danhSachDiem === 'undefined' || !Array.isArray(danhSachDiem)) {
        resultContainer.innerHTML = `<div class="no-result">Chưa nạp được file data.js hoặc định dạng dữ liệu chưa đúng!</div>`;
        resultContainer.style.display = 'block';
        return;
      }

      const ketQuaTimKiem = danhSachDiem.filter(ts => {
        const matchSBD = inputSBD ? (ts.sbd && ts.sbd.toString().toLowerCase().includes(inputSBD)) : true;
        const matchName = inputName ? (ts.hoTen && ts.hoTen.toLowerCase().includes(inputName)) : true;
        return matchSBD && matchName;
      });

      resultContainer.style.display = 'block';

      if (ketQuaTimKiem.length === 0) {
        resultContainer.innerHTML = `
          <div class="no-result">
            Không tìm thấy kết quả phù hợp với thông tin đã nhập.<br>
            Vui lòng kiểm tra lại Số Báo Danh hoặc Họ tên!
          </div>
        `;
      } else {
        let htmlContent = '';

        if (ketQuaTimKiem.length > 1) {
          htmlContent += `<div class="multiple-results-notice">Tìm thấy ${ketQuaTimKiem.length} kết quả phù hợp:</div>`;
        }

        ketQuaTimKiem.forEach(ts => {
          const isPass = ts.ketQua && ts.ketQua.trim().toLowerCase() === 'đạt';
          const badgeClass = isPass ? 'badge-pass' : 'badge-fail';

          htmlContent += `
            <div class="result-card" style="margin-bottom: 15px;">
              <div class="result-header">${ts.hoTen}</div>
              <div class="info-row">
                <span class="info-label">Số Báo Danh:</span>
                <span class="info-value">${ts.sbd || '---'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Ngày sinh:</span>
                <span class="info-value">${ts.ngaySinh || '---'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Nói:</span>
                <span class="info-value">${ts.diemNoi || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Nghe:</span>
                <span class="info-value">${ts.diemNghe || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Đọc - Viết:</span>
                <span class="info-value">${ts.diemDocViet || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Tổng:</span>
                <span class="info-value" style="color: #0084c7; font-size: 17px;">${ts.tongDiem || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Kết quả:</span>
                <span class="${badgeClass}">${ts.ketQua || 'N/A'}</span>
              </div>
            </div>
          `;
        });

        resultContainer.innerHTML = htmlContent;
      }
    }
  </script>
</body>
</html>

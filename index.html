<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Điểm Thi - Trường Đại Học Gia Định</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      margin-top: 20px;
    }

    /* HEADER & LOGO CHUẨN */
    .header {
      background-color: #0f172a; /* Nền xanh đen chuẩn logo gốc */
      padding: 30px 20px;
      text-align: center;
      color: #ffffff;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }

    .logo-svg {
      width: 140px;
      height: 140px;
    }

    .school-title {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .exam-title {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 5px;
    }

    /* FORM TRA CỨU */
    .search-card {
      padding: 30px 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1e293b;
      font-size: 15px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-group input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .note-text {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 18px;
      font-style: italic;
    }

    .btn-search {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-search:hover {
      background-color: #0369a1;
    }

    /* KẾT QUẢ TRA CỨU */
    .result-container {
      margin-top: 25px;
      display: none;
    }

    .result-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
    }

    .result-header {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 15px;
      text-align: center;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #cbd5e1;
      font-size: 15px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #64748b;
      font-weight: 500;
    }

    .info-value {
      color: #0f172a;
      font-weight: 600;
    }

    .badge-pass {
      color: #16a34a;
      background-color: #dcfce7;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
    }

    .badge-fail {
      color: #dc2626;
      background-color: #fee2e2;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
    }

    .no-result {
      text-align: center;
      color: #ef4444;
      font-weight: 600;
      padding: 15px;
      background-color: #fef2f2;
      border-radius: 10px;
      border: 1px solid #fecaca;
    }

    .multiple-results-notice {
      font-size: 13px;
      color: #0284c7;
      margin-bottom: 10px;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HEADER VỚI LOGO TRƯỜNG ĐẠI HỌC GIA ĐỊNH CHUẨN -->
    <div class="header">
      <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <!-- Vòng nguyệt quế vàng -->
          <g fill="#d97706">
            <path d="M 60 140 C 40 110, 40 70, 70 40 C 65 55, 60 75, 70 95 C 60 110, 55 125, 60 140 Z"/>
            <path d="M 45 120 C 30 100, 35 75, 55 55 C 50 70, 50 85, 55 100 C 48 110, 45 115, 45 120 Z"/>
            <path d="M 140 140 C 160 110, 160 70, 130 40 C 135 55, 140 75, 130 95 C 140 110, 145 125, 140 140 Z"/>
            <path d="M 155 120 C 170 100, 165 75, 145 55 C 150 70, 150 85, 145 100 C 152 110, 155 115, 155 120 Z"/>
          </g>

          <!-- Khiên xanh đậm viền vàng -->
          <path d="M 100 30 L 150 50 V 100 C 150 135, 100 160, 100 160 C 100 160, 50 135, 50 100 V 50 Z" 
                fill="#1e3a8a" stroke="#d97706" stroke-width="4"/>

          <!-- Họa tiết đan xen & chữ GD -->
          <g stroke="#d97706" stroke-width="3" fill="none">
            <rect x="80" y="70" width="40" height="40" transform="rotate(45 100 90)" />
            <rect x="80" y="70" width="40" height="40" />
          </g>
          <text x="100" y="96" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#d97706" text-anchor="middle">GD</text>

          <!-- Dải lụa POPULARIS -->
          <path d="M 40 145 Q 100 165 160 145 L 150 130 Q 100 148 50 130 Z" fill="#1e3a8a" stroke="#d97706" stroke-width="2"/>
          <text x="100" y="144" font-family="serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="2">POPULARIS</text>
        </svg>

        <div class="school-title">GIA DINH UNIVERSITY</div>
        <div class="exam-title">KỲ THI ĐÁNH GIÁ NĂNG LỰC TIẾNG ANH ĐẦU VÀO</div>
      </div>
    </div>

    <!-- FORM TRA CỨU -->
    <div class="search-card">
      <form id="searchForm" onsubmit="traCuuDiem(event)">
        
        <div class="form-group">
          <label for="sbdInput">Số Báo Danh (SBD):</label>
          <!-- Đã đổi gợi ý mờ (placeholder) sang dạng mã định dạng chung -->
          <input type="text" id="sbdInput" placeholder="Nhập Số Báo Danh (Ví dụ: SBD12345)" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="hoTenInput">Họ và Tên thí sinh:</label>
          <!-- Đã đổi gợi ý mờ (placeholder) sang tên mẫu chung -->
          <input type="text" id="hoTenInput" placeholder="Nhập Họ và Tên (Ví dụ: Nguyễn Văn A)" autocomplete="off">
        </div>

        <div class="note-text">* Bạn có thể nhập Số Báo Danh, Họ tên hoặc nhập cả hai để tìm kiếm.</div>

        <button type="submit" class="btn-search">Tra Cứu Kết Quả</button>
      </form>

      <!-- KHU VỰC HIỂN THỊ KẾT QUẢ -->
      <div id="resultContainer" class="result-container"></div>
    </div>
  </div>

  <!-- BẢO ĐẢM NẠP FILE DATA.JS -->
  <script src="data.js"></script>

  <script>
    function traCuuDiem(event) {
      event.preventDefault();

      const inputSBD = document.getElementById('sbdInput').value.trim().toLowerCase();
      const inputName = document.getElementById('hoTenInput').value.trim().toLowerCase();
      const resultContainer = document.getElementById('resultContainer');

      if (!inputSBD && !inputName) {
        alert("Vui lòng nhập Số Báo Danh hoặc Họ và Tên để tra cứu!");
        return;
      }

      // Kiểm tra nạp file data.js
      if (typeof danhSachDiem === 'undefined' || !Array.isArray(danhSachDiem)) {
        resultContainer.innerHTML = `<div class="no-result">Chưa nạp được file data.js hoặc định dạng dữ liệu chưa đúng!</div>`;
        resultContainer.style.display = 'block';
        return;
      }

      // Lọc dữ liệu theo thông tin thí sinh nhập vào
      const ketQuaTimKiem = danhSachDiem.filter(ts => {
        const matchSBD = inputSBD ? (ts.sbd && ts.sbd.toString().toLowerCase().includes(inputSBD)) : true;
        const matchName = inputName ? (ts.hoTen && ts.hoTen.toLowerCase().includes(inputName)) : true;
        return matchSBD && matchName;
      });

      resultContainer.style.display = 'block';

      if (ketQuaTimKiem.length === 0) {
        resultContainer.innerHTML = `
          <div class="no-result">
            Không tìm thấy kết quả phù hợp với thông tin đã nhập.<br>
            Vui lòng kiểm tra lại Số Báo Danh hoặc Họ tên!
          </div>
        `;
      } else {
        let htmlContent = '';

        if (ketQuaTimKiem.length > 1) {
          htmlContent += `<div class="multiple-results-notice">Tìm thấy ${ketQuaTimKiem.length} kết quả phù hợp:</div>`;
        }

        ketQuaTimKiem.forEach(ts => {
          const isPass = ts.ketQua && ts.ketQua.trim().toLowerCase() === 'đạt';
          const badgeClass = isPass ? 'badge-pass' : 'badge-fail';

          htmlContent += `
            <div class="result-card" style="margin-bottom: 15px;">
              <div class="result-header">${ts.hoTen}</div>
              <div class="info-row">
                <span class="info-label">Số Báo Danh:</span>
                <span class="info-value">${ts.sbd || '---'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Ngày sinh:</span>
                <span class="info-value">${ts.ngaySinh || '---'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Nói:</span>
                <span class="info-value">${ts.diemNoi || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Nghe:</span>
                <span class="info-value">${ts.diemNghe || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Đọc - Viết:</span>
                <span class="info-value">${ts.diemDocViet || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Điểm Tổng:</span>
                <span class="info-value" style="color: #0284c7; font-size: 17px;">${ts.tongDiem || '0'}</span>
              </div>
              <div class="info-row">
                <span class="info-label">Kết quả:</span>
                <span class="${badgeClass}">${ts.ketQua || 'N/A'}</span>
              </div>
            </div>
          `;
        });

        resultContainer.innerHTML = htmlContent;
      }
    }
  </script>
</body>
</html>
